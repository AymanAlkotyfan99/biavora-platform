[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bi_platform_shared"
version = "1.0.0"
description = "Shared contracts, permissions, and infrastructure helpers for the BI Agentic Platform microservices."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5,<3.0",
  "requests>=2.31,<3.0",
  "djangorestframework>=3.14,<4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bi_platform_shared*"]
